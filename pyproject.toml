[project]
name = "mysql-ecommerce-analytics"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=49.0.0",
    "kaggle>=2.2.3",
    "lightgbm>=4.6.0",
    "matplotlib>=3.11.0",
    "mlxtend>=0.25.0",
    "pandas>=3.0.3",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "shap>=0.52.0",
    "tabulate>=0.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
